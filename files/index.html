<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="File share — jonathangf.com" />
  <title>Files — jonathangf.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f3;
      --surface: #ffffff;
      --border: #dfe1dd;
      --accent: #1f5f52;
      --text: #1e2624;
      --muted: #626b67;
      --display: 'Source Serif 4', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 800px; margin: 0 auto; padding: 0 24px; }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
    }
    header .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .logo {
      font-family: var(--display);
      font-weight: 600;
      font-size: 1.15rem;
      text-decoration: none;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    nav { display: flex; gap: 24px; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--accent); }

    /* ── HERO ── */
    .hero { padding: 56px 0 40px; }
    .hero-tag {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .hero h1 {
      font-family: var(--display);
      font-size: clamp(1.9rem, 4vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
    }
    .hero p { color: var(--muted); font-size: 0.98rem; line-height: 1.75; max-width: 600px; }

    /* ── EXPLORER ── */
    section#explorer { padding: 32px 0 90px; border-top: 1px solid var(--border); margin-top: 8px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .file-count { font-size: 0.85rem; color: var(--muted); }
    .file-search {
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 9px 12px;
      min-width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .file-search:focus { border-color: var(--accent); }
    .file-search::placeholder { color: var(--muted); }

    .file-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:hover, .file-row:focus-visible { background: rgba(31,95,82,0.05); }
    .file-row:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }

    .file-icon { font-size: 1.05rem; flex: 0 0 auto; }
    .file-name {
      flex: 1 1 auto;
      font-size: 0.92rem;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .file-ext {
      flex: 0 0 auto;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--accent);
      background: rgba(31,95,82,0.09);
      padding: 3px 9px;
      border-radius: 3px;
    }
    .file-size {
      flex: 0 0 auto;
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 64px;
      text-align: right;
    }
    .file-actions { flex: 0 0 auto; display: flex; gap: 8px; }
    .file-actions button, .file-actions a {
      font-family: var(--sans);
      font-size: 0.78rem;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      padding: 7px 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .file-actions button:hover, .file-actions a:hover { border-color: var(--accent); color: var(--accent); }

    .empty-state, .error-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 560px) {
      .file-size { display: none; }
      .file-row { flex-wrap: wrap; }
      .file-actions { width: 100%; justify-content: flex-end; }
    }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 26, 24, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
      max-width: 860px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 0.9rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .modal-header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .modal-header-actions a, .modal-close {
      font-family: var(--sans);
      font-size: 0.78rem;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      padding: 7px 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-header-actions a:hover, .modal-close:hover { border-color: var(--accent); color: var(--accent); }
    .modal-body { flex: 1 1 auto; overflow: auto; }
    .modal-body iframe { width: 100%; height: 70vh; border: none; display: block; }
    .modal-body pre {
      margin: 0;
      padding: 20px;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }
    .modal-body .modal-status { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 0.9rem; }

    /* ── FOOTER ── */
    footer { border-top: 1px solid var(--border); padding: 24px 0; }
    footer .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .footer-text { font-size: 0.78rem; color: var(--muted); }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a { color: var(--muted); text-decoration: none; font-size: 0.78rem; transition: color 0.2s; }
    .footer-links a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="wrap">
      <a class="logo" href="../index.html">jonathangf<span>.</span>com</a>
      <nav>
        <a href="../index.html">Home</a>
        <a href="../indexcv.html">Résumé</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <div class="hero-tag">// files</div>
        <h1>File share.</h1>
        <p>Browse and open whatever's been dropped in here. Some formats preview inline, everything else downloads directly.</p>
      </div>
    </section>

    <section id="explorer">
      <div class="wrap">
        <div class="toolbar">
          <span class="file-count" id="fileCount">Loading…</span>
          <input class="file-search" id="fileSearch" type="text" placeholder="Filter files…" autocomplete="off" />
        </div>
        <div class="file-list" id="fileList"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-text">2000-2026 © Jonathan González</div>
      <div class="footer-links">
        <a href="mailto:info@jonathangf.com">Email</a>
        <a href="../index.html">Home</a>
      </div>
    </div>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-header-actions">
          <a id="modalDownload" href="#" download>Download</a>
          <button class="modal-close" id="modalClose" type="button">Close ✕</button>
        </div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    (function () {
      // Extensions the browser can render natively — open inline. Anything else downloads.
      var IFRAME_EXT = ['html', 'htm', 'pdf'];
      var TEXT_EXT = ['txt', 'css', 'js', 'md'];
      var PREVIEWABLE = IFRAME_EXT.concat(TEXT_EXT);

      var ICONS = {
        pdf: '📕', html: '🌐', htm: '🌐', txt: '📄', md: '📝',
        css: '🎨', js: '⚙️'
      };
      var DEFAULT_ICON = '📦';

      var fileListEl = document.getElementById('fileList');
      var fileCountEl = document.getElementById('fileCount');
      var fileSearchEl = document.getElementById('fileSearch');
      var overlay = document.getElementById('modalOverlay');
      var modalTitle = document.getElementById('modalTitle');
      var modalBody = document.getElementById('modalBody');
      var modalDownload = document.getElementById('modalDownload');
      var modalClose = document.getElementById('modalClose');

      var allFiles = [];

      function ext(name) {
        var i = name.lastIndexOf('.');
        return i === -1 ? '' : name.slice(i + 1).toLowerCase();
      }

      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function render(files) {
        fileListEl.innerHTML = '';

        if (!files.length) {
          var empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = allFiles.length ? 'No files match your filter.' : 'No files here yet.';
          fileListEl.appendChild(empty);
          return;
        }

        files.forEach(function (file) {
          var e = ext(file.name);
          var previewable = PREVIEWABLE.indexOf(e) !== -1;
          var url = encodeURIComponent(file.name);

          var row = document.createElement('div');
          row.className = 'file-row';
          row.tabIndex = 0;
          row.setAttribute('role', 'button');
          row.setAttribute('aria-label', (previewable ? 'Preview ' : 'Download ') + file.name);

          var icon = document.createElement('span');
          icon.className = 'file-icon';
          icon.textContent = ICONS[e] || DEFAULT_ICON;

          var name = document.createElement('span');
          name.className = 'file-name';
          name.textContent = file.name;

          var extBadge = document.createElement('span');
          extBadge.className = 'file-ext';
          extBadge.textContent = e ? e.toUpperCase() : 'FILE';

          var size = document.createElement('span');
          size.className = 'file-size';
          size.textContent = formatSize(file.size);

          var actions = document.createElement('span');
          actions.className = 'file-actions';

          if (previewable) {
            var viewBtn = document.createElement('button');
            viewBtn.type = 'button';
            viewBtn.textContent = 'View';
            viewBtn.addEventListener('click', function (evt) {
              evt.stopPropagation();
              openPreview(file);
            });
            actions.appendChild(viewBtn);
          }

          var dlLink = document.createElement('a');
          dlLink.href = url;
          dlLink.setAttribute('download', file.name);
          dlLink.textContent = 'Download';
          dlLink.addEventListener('click', function (evt) { evt.stopPropagation(); });
          actions.appendChild(dlLink);

          row.appendChild(icon);
          row.appendChild(name);
          row.appendChild(extBadge);
          row.appendChild(size);
          row.appendChild(actions);

          row.addEventListener('click', function () {
            if (previewable) {
              openPreview(file);
            } else {
              dlLink.click();
            }
          });
          row.addEventListener('keydown', function (evt) {
            if (evt.key === 'Enter' || evt.key === ' ') {
              evt.preventDefault();
              row.click();
            }
          });

          fileListEl.appendChild(row);
        });
      }

      function openPreview(file) {
        var e = ext(file.name);
        var url = encodeURIComponent(file.name);

        modalTitle.textContent = file.name;
        modalDownload.href = url;
        modalDownload.setAttribute('download', file.name);
        modalBody.innerHTML = '';

        if (IFRAME_EXT.indexOf(e) !== -1) {
          var iframe = document.createElement('iframe');
          iframe.src = url;
          modalBody.appendChild(iframe);
        } else {
          var status = document.createElement('div');
          status.className = 'modal-status';
          status.textContent = 'Loading…';
          modalBody.appendChild(status);

          fetch(url)
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.text();
            })
            .then(function (text) {
              modalBody.innerHTML = '';
              var pre = document.createElement('pre');
              pre.textContent = text;
              modalBody.appendChild(pre);
            })
            .catch(function () {
              modalBody.innerHTML = '';
              var err = document.createElement('div');
              err.className = 'modal-status';
              err.textContent = 'Could not load this file.';
              modalBody.appendChild(err);
            });
        }

        overlay.classList.add('open');
        modalClose.focus();
      }

      function closePreview() {
        overlay.classList.remove('open');
        modalBody.innerHTML = '';
      }

      modalClose.addEventListener('click', closePreview);
      overlay.addEventListener('click', function (evt) {
        if (evt.target === overlay) closePreview();
      });
      document.addEventListener('keydown', function (evt) {
        if (evt.key === 'Escape' && overlay.classList.contains('open')) closePreview();
      });

      fileSearchEl.addEventListener('input', function () {
        var q = fileSearchEl.value.trim().toLowerCase();
        var filtered = q ? allFiles.filter(function (f) { return f.name.toLowerCase().indexOf(q) !== -1; }) : allFiles;
        render(filtered);
      });

      fetch('manifest.json')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (files) {
          allFiles = files || [];
          fileCountEl.textContent = allFiles.length + (allFiles.length === 1 ? ' file' : ' files');
          render(allFiles);
        })
        .catch(function () {
          fileCountEl.textContent = '';
          fileListEl.innerHTML = '<div class="error-state">Could not load the file list.</div>';
        });
    })();
  </script>
</body>
</html>
